version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: packages/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - communication-service
      - workflow-service

  communication-service:
    build:
      context: .
      dockerfile: packages/communication-service/Dockerfile
    ports:
      - "3001:3001"
    env_file: .env

  workflow-service:
    build:
      context: .
      dockerfile: packages/workflow-service/Dockerfile
    ports:
      - "3002:3002"
    env_file: .env

  timeline-service:
    build:
      context: .
      dockerfile: packages/timeline-service/Dockerfile
    ports:
      - "3003:3003"
    env_file: .env
    depends_on:
      - kafka

  notification-service:
    build:
      context: .
      dockerfile: packages/notification-service/Dockerfile
    ports:
      - "3004:3004"
    env_file: .env
    depends_on:
      - kafka


  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

